server {
    listen 0.0.0.0:8080;
    client_max_body_size    100000;
    error_page 404 html/error/404.html;
    location / {
        root html;
        index index.html;
        autoindex on;
        allowed_methods GET POST DELETE;
        cgi_pass php /usr/bin/php-cgi;

    }
    location /upload {
        index index.html;
        root html/upload;
        upload_path html/upload;
    }

    location /redirect {
        return 301 http://www.google.com;
    }

    location /cgi-bin {
        index index.php;
        root html/cgi-bin;
        # cgi_pass py /usr/bin/python3;
        cgi_pass php /usr/bin/php-cgi;
        cgi_pass sh /bin/bash;
        autoindex on;
        # allowed_methods GET POST;
    }
}


